<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Afinador</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="../app.css">


<main>
  <header>
    <span class="eyebrow">la = 440 Hz</span>
  </header>

  <section class="tuning-select">
    <span class="eyebrow">Afinación</span>
    <select id="tuningSelect" aria-label="Afinación"></select>
    <div class="tuning-meta" id="tuningMeta"></div>
  </section>

  <section class="strings" id="strings" aria-label="Cuerdas"></section>

  <section class="meter" id="meter">
    <div class="readout">
      <div class="cents" id="centsOut" style="visibility:hidden">—<small>cents</small></div>
      <div class="freq" id="freqLine" style="visibility:hidden"><b id="freqOut">—</b> Hz</div>
      <div class="target"><span id="targetOut">—</span> Hz <span id="targetNote"></span></div>
    </div>
    <svg class="scale" viewBox="0 0 600 84" aria-hidden="true">
      <g id="ticks" stroke="var(--line-strong)" stroke-width="1"></g>
      <rect x="290" y="6" width="20" height="40" rx="2" fill="var(--accent-soft)"></rect>
      <g id="needle" transform="translate(300 0)">
        <polygon points="-6,0 6,0 0,10" fill="var(--needle)"></polygon>
        <line x1="0" y1="8" x2="0" y2="48" stroke="var(--needle)" stroke-width="2"></line>
      </g>
      <g font-family="IBM Plex Mono, monospace" font-size="11" fill="var(--muted)" text-anchor="middle">
        <text x="30" y="72">−50</text><text x="165" y="72">−25</text><text x="300" y="72">0</text>
        <text x="435" y="72">+25</text><text x="570" y="72">+50</text>
      </g>
    </svg>
    <div class="status" id="status">Toca arriba la cuerda que vas a afinar y púlsala al aire.</div>
    <div class="controls">
      <button id="micBtn">Micrófono off</button>
      <button id="toneBtn">Tono de referencia</button>
    </div>
    <div class="sens"><label for="inSel">entrada</label><select id="inSel"><option value="">entrada por defecto</option></select><span></span></div>
    <div class="sens"><label for="sens">sensibilidad</label><input type="range" id="sens" min="-60" max="-20" step="1" value="-40"><output id="sensOut">−40 dB</output></div>
  </section>

  <details id="libDetails">
    <summary>Afinaciones guardadas</summary>
    <div class="lib-list" id="libList"></div>

    <div class="form">
      <span class="eyebrow" style="margin-top:8px">Copia de respaldo</span>
      <div class="help">Las afinaciones que agregas quedan en este navegador. Para llevarlas a otro aparato, copia el texto de abajo y pégalo allá con "Importar".</div>
      <textarea id="ioText" spellcheck="false"></textarea>
      <div class="actions">
        <button id="exportBtn">Exportar las guardadas</button>
        <button id="importBtn">Importar</button>
      </div>
      <div class="help" id="ioStatus"></div>
    </div>
  </details>

  <details id="formDetails">
    <summary>Nueva afinación</summary>
    <div class="form" id="form">
      <div class="field"><label for="fName">Nombre</label><input type="text" id="fName" placeholder="Nombre de la pieza o del set"></div>
      <div class="row">
        <div class="field"><label for="fCount">Cuerdas</label><input type="number" id="fCount" min="1" max="12" value=""></div>
        <div class="field" id="fundField"><label for="fFund">Fundamental (Hz)</label><input type="number" id="fFund" step="any" placeholder="190"></div>
      </div>
      <div class="field">
        <label>Cómo vienen las alturas</label>
        <div class="modes" role="tablist">
          <button type="button" data-mode="ratio" class="on">Razón × fundamental</button>
          <button type="button" data-mode="hz">Hz</button>
          <button type="button" data-mode="note">Nota + cents</button>
        </div>
        <div class="help" id="modeHelp"></div>
      </div>
      <div style="overflow-x:auto"><table class="entry" id="entry"></table></div>
      <div class="actions">
        <button class="primary" id="saveBtn">Guardar</button>
        <button id="clearBtn">Vaciar</button>
      </div>
    </div>
  </details>
</main>

<script>
window.AFINADOR = {
  clave: 'afinador.bajo.afinaciones',
  cuerdas: 4,
  pasaAltos: 30,
  afinaciones: [
  ],
};
</script>
<script src="../app.js"></script>
